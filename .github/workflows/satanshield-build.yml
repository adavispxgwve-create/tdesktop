name: SatanShield Build

# Manual trigger, plus any push to the satanshield branch. Builds a single
# Windows x64 / Qt6 Release Telegram.exe and uploads it as an artifact.
on:
  workflow_dispatch:
  push:
    branches: [satanshield]

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    env:
      ONLY_CACHE: "false"
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
    defaults:
      run:
        shell: cmd
    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Free up runner disk space.
        shell: pwsh
        run: |
          $before = [math]::Round((Get-PSDrive C).Free/1GB,1)
          $targets = @(
            'C:\Android', "$env:ANDROID_HOME", "$env:ANDROID_SDK_ROOT",
            'C:\Program Files\MongoDB', 'C:\Program Files\MySQL', 'C:\Program Files\PostgreSQL',
            'C:\Program Files\Microsoft SQL Server', 'C:\Program Files (x86)\Microsoft SQL Server',
            'C:\Program Files\Unity', 'C:\Program Files\Amazon', 'C:\Program Files\R',
            'C:\hostedtoolcache\windows\Ruby', 'C:\hostedtoolcache\windows\go',
            'C:\hostedtoolcache\windows\Java_Temurin-Hotspot_jdk', 'C:\SeleniumWebDrivers',
            'C:\Program Files (x86)\Google', 'C:\Program Files\LLVM'
          )
          foreach($p in ($targets | Select-Object -Unique)){
            if($p -and (Test-Path $p)){ try{ Remove-Item $p -Recurse -Force -ErrorAction Stop; Write-Host "removed $p" }catch{ Write-Host "skip $p" } }
          }
          $after = [math]::Round((Get-PSDrive C).Free/1GB,1)
          Write-Host "Free C: $before GB -> $after GB"

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: false
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: Submodules.
        shell: bash
        run: |
          cd "$TBUILD/$REPO_NAME"
          # Top-level submodules are all on GitHub — init them (non-recursive first).
          git submodule update --init --force
          # cmake_helpers pulls a Linux-only glib/cppgir submodule from gitlab.com, which
          # 403s on CI runners and is unused on Windows. Disable it in every .gitmodules
          # so the recursive init below skips it instead of aborting the whole checkout.
          find . -name .gitmodules -print0 | while IFS= read -r -d '' gm; do
            key=$(git config -f "$gm" --get-regexp 'submodule\..*\.url' 2>/dev/null | awk '/gitlab\.com\/mnauw\/cppgir/{print $1}')
            if [ -n "$key" ]; then git config -f "$gm" "${key%.url}.update" none; echo "disabled cppgir in $gm"; fi
          done
          git submodule update --init --force --recursive
          # The runner's newer MSVC now emits C5038/C4265 warnings inside the MicroTeX
          # submodule; tdesktop's "special target" turns warnings into errors (/WX). We
          # don't need strict warnings for our fork — drop the /WX line from cmake_helpers.
          sed -i '/^[[:space:]]*\/WX[[:space:]]*$/d' cmake/options_win.cmake && echo "removed /WX from options_win.cmake"

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV
          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake
          # tg_owt's libyuv submodule is hosted on gitlab.com, which 403s clones from CI
          # runners. Redirect it to Google's authoritative libyuv mirror (same commits,
          # reliable anonymous access). Also make git retry transient network failures.
          git config --global url."https://chromium.googlesource.com/libyuv/libyuv".insteadOf "https://gitlab.com/chromiumsrc/libyuv.git"
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 60
          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache (restore).
        id: cache-tp
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-x64-third-party-v2-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-third-party-v2-

      # Libraries EXCEPT Qt — and crucially INCLUDING cache_keys\* (win.bat reads those
      # to know what's already built; without them it rebuilds everything). Qt is a
      # separate cache to keep each blob under GitHub's 10GB limit.
      - name: Libraries cache (restore).
        id: cache-libs
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-v3-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-libs-v3-

      - name: Qt cache (restore).
        id: cache-qt
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qt6-v3-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-qt6-v3-

      - name: Libraries.
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat skip-release silent qt6

      - name: Free up some disk space.
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete

      # Save the built third-party BEFORE the risky Telegram compile, and even if a
      # later step fails — so a failed build doesn't force a ~1h Libraries rebuild next
      # time. Skipped when it was already an exact-key cache hit.
      - name: ThirdParty cache (save).
        if: always() && steps.cache-tp.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-x64-third-party-v2-${{ env.CACHE_KEY }}
      - name: Libraries cache (save).
        if: always() && steps.cache-libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-v3-${{ env.CACHE_KEY }}
      - name: Qt cache (save).
        if: always() && steps.cache-qt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qt6-v3-${{ env.CACHE_KEY }}

      - name: Telegram Desktop build.
        if: env.ONLY_CACHE == 'false'
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram
          call configure.bat ^
          x64 ^
          qt6 ^
          -D TDESKTOP_API_ID=${{ secrets.TDESKTOP_API_ID || '611335' }} ^
          -D TDESKTOP_API_HASH=${{ secrets.TDESKTOP_API_HASH || 'd524b414d21f4d37f08684c1df41ac9c' }} ^
          -D CMAKE_CONFIGURATION_TYPES=Debug ^
          -D CMAKE_COMPILE_WARNING_AS_ERROR=OFF ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON
          cmake --build ..\out --config Debug --parallel

      - name: Collect artifact.
        run: |
          set OUT=%TBUILD%\%REPO_NAME%\out\Debug
          mkdir artifact
          move %OUT%\Telegram.exe artifact\

      - uses: actions/upload-artifact@v7
        name: Upload artifact.
        with:
          name: SatanShield-Telegram-x64
          path: artifact\
